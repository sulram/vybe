[package]
name = "vybe-cli"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
description = "The `vybe` command: run, render, check a .vy patch — the verification loop an author (human or model) closes alone."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sulram/vybe"
publish = false

[[bin]]
name = "vybe"
path = "src/main.rs"

[dependencies]
vybe = { path = "../.." }
vybe-remote = { path = "../vybe-remote" }
keystone = { path = "../keystone" }
vybe-video = { path = "../vybe-video", optional = true }
clap = { version = "4", features = ["derive"] }

[features]
# Video with sound, through GStreamer (a system library). Build without it —
# `--no-default-features` — where GStreamer isn't installed: patches without
# `video` run just the same, and `vybe check` says what a `video` needs.
default = ["video"]
video = ["dep:vybe-video"]
